<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>manageAvatarScript: the view</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        /* The host's colours: the card and the preview take their text colour from here. */
        background: #f3f5f9;
        color: #1d2330;
      }
      /* A dark host, whatever the system's colour scheme: open the page with ?dark */
      body.dark {
        background: #161a22;
        color: #e6e9ef;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px;
      }
      section {
        margin-bottom: 16px;
        border-radius: 10px;
        background: #fff;
      }
      body.dark section {
        background: #1f2530;
      }
      #preview {
        padding: 10px 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="preview"></section>
      <section id="view"></section>
    </main>
    <script>
      if (new URLSearchParams(location.search).has("dark")) document.body.classList.add("dark");
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

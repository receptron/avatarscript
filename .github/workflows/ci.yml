name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads: checkout, install, typecheck, build, test and a pack-install-render
# smoke. Nothing writes to the repository, so the default token needs nothing else.
permissions:
  contents: read

# A pull request supersedes its own earlier pushes, so cancelling them frees the runners the
# newest push is waiting for. A push to main is not cancelled: nothing would then hold a result
# for that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The mesh avatar engine is bundled from this mesh-avatar-studio commit at build time. Pinned so
# an upstream change cannot silently change what CI builds and ships; move it on purpose, in a
# commit of its own, after rendering the examples with the new engine.
env:
  MESH_AVATAR_STUDIO_REF: 8713e85a00e50f5cdf8fe33294b961d1d6506fc9

jobs:
  # Platform-independent: prettier, eslint, tsc and the build answer the same on every runner, so
  # they run once. Separate from the tests so a lint or type error surfaces without waiting for them.
  checks:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: avatarscript
    steps:
      # Side by side, as in development: the build bundles the engine from ../mesh-avatar-studio.
      # Not nested inside this checkout, where vitest and tsc would pick up its files.
      - uses: actions/checkout@v6
        with:
          path: avatarscript
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: shinshin86/mesh-avatar-studio
          ref: ${{ env.MESH_AVATAR_STUDIO_REF }}
          path: mesh-avatar-studio
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avatarscript/package-lock.json

      # PUPPETEER_SKIP_DOWNLOAD: nothing here starts a browser, and Chrome is most of the install.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Prettier first: a formatting slip is the cheapest failure to read.
      - name: Format
        run: npm run format:check

      # Includes the type-aware rules (no floating promises, no `any` arriving from outside).
      - name: Lint
        run: npm run lint

      # Covers src, tests and scripts (tsconfig.json includes all three). Needed on its own
      # because vitest strips types rather than checking them.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The build must have bundled the pinned engine, not whatever happened to be checked out.
      - name: Check the bundled engine
        run: |
          node -e "
            const s = JSON.parse(require('fs').readFileSync('dist/engine/source.json', 'utf8'));
            if (s.commit !== process.env.MESH_AVATAR_STUDIO_REF || s.modified) {
              console.error('bundled engine', s); process.exit(1);
            }
            console.log('bundled engine', s.commit);"

  # ubuntu + macOS: the unit tests need no browser and no API key (CLAUDE.md), but kuromoji's
  # dictionary loading and path handling are worth running on both platforms the CLI is used on.
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Test
        run: npm test

  # Verifies the published package actually works: scripts/smoke.sh packs the exact tarball
  # (prepack builds dist/ and bundles the engine), installs it into an empty folder with no
  # mesh-avatar-studio and no esbuild beside it, and renders videos through the CLI and the
  # library with the offline mock voice, checking codec, length and that the frames are not
  # blank. Run the same script locally before changing packaging or rendering.
  package-smoke:
    name: Package smoke (pack, install, render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: avatarscript
    steps:
      - uses: actions/checkout@v6
        with:
          path: avatarscript
          persist-credentials: false
      # Also the source of the sample avatar the smoke renders.
      - uses: actions/checkout@v6
        with:
          repository: shinshin86/mesh-avatar-studio
          ref: ${{ env.MESH_AVATAR_STUDIO_REF }}
          path: mesh-avatar-studio
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: avatarscript/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Ubuntu 23.10+ blocks the unprivileged user namespaces Chrome's sandbox needs, and
      # headless Chrome then refuses to start. Re-allowing them keeps the sandbox on instead of
      # rendering with --no-sandbox, which the package never passes.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # This install keeps Puppeteer's Chrome download: the package installed by the smoke
      # resolves the same Chrome from the shared cache.
      - run: npm ci

      - name: Pack, install, render
        run: scripts/smoke.sh ../mesh-avatar-studio/samples/miko-qipao

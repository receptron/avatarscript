name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads: checkout, install, typecheck, build, test and a pack-install-render
# smoke. Nothing writes to the repository, so the default token needs nothing else.
permissions:
  contents: read

# A pull request supersedes its own earlier pushes, so cancelling them frees the runners the
# newest push is waiting for. A push to main is not cancelled: nothing would then hold a result
# for that commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The mesh avatar engine is bundled at build time from the mesh-avatar development dependency,
# pinned to an exact version in package.json so an upstream release cannot silently change what CI
# builds and ships; move it on purpose, in a commit of its own, after rendering the examples with it.
env:
  # onnxruntime-node's install script fetches its CUDA binaries from NuGet on Linux x64 (hundreds of
  # MB, per install). Alignment runs on the CPU binaries the package already contains.
  ONNXRUNTIME_NODE_INSTALL: skip

# Timeouts are generous: here they also count time spent queued for a runner, and jobs that take
# a minute were cancelled after 15 minutes of waiting when runners were busy.
jobs:
  # Platform-independent: prettier, eslint, tsc and the build answer the same on every runner, so
  # they run once. Separate from the tests so a lint or type error surfaces without waiting for them.
  checks:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      # PUPPETEER_SKIP_DOWNLOAD: nothing here starts a browser, and Chrome is most of the install.
      - run: yarn install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # Prettier first: a formatting slip is the cheapest failure to read.
      - name: Format
        run: yarn format:check

      # Includes the type-aware rules (no floating promises, no `any` arriving from outside).
      - name: Lint
        run: yarn lint

      # Covers src, tests and scripts (tsconfig.json includes all three). Needed on its own
      # because vitest strips types rather than checking them.
      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      # The build must have bundled the version package.json pins, not whatever was installed.
      - name: Check the bundled engine
        run: |
          node -e "
            const s = JSON.parse(require('fs').readFileSync('dist/engine/source.json', 'utf8'));
            const pinned = JSON.parse(require('fs').readFileSync('package.json', 'utf8')).devDependencies['mesh-avatar'];
            if (s.version !== pinned) { console.error('bundled engine', s, 'pinned', pinned); process.exit(1); }
            console.log('bundled engine', s.package + '@' + s.version);"

  # ubuntu + macOS: the unit tests need no browser and no API key (CLAUDE.md), but kuromoji's
  # dictionary loading and path handling are worth running on both platforms the CLI is used on.
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - run: yarn install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Test
        run: yarn test

  # Verifies the published package actually works: scripts/smoke.sh packs the exact tarball
  # (prepack builds dist/ and bundles the engine), installs it into an empty folder with no
  # mesh-avatar package and no esbuild beside it, and renders videos through the CLI and the
  # library with the offline mock voice, checking codec, length and that the frames are not
  # blank. Run the same script locally before changing packaging or rendering.
  package-smoke:
    name: Package smoke (pack, install, render)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Ubuntu 23.10+ blocks the unprivileged user namespaces Chrome's sandbox needs, and
      # headless Chrome then refuses to start. Re-allowing them keeps the sandbox on instead of
      # rendering with --no-sandbox, which the package never passes.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # This install keeps Puppeteer's Chrome download: the package installed by the smoke
      # resolves the same Chrome from the shared cache.
      - run: yarn install --frozen-lockfile

      - name: Pack, install, render
        run: scripts/smoke.sh avatars/ani
